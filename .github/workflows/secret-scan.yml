# Push-time secret scan (verified live secrets only). Scans just the commits in each push.
# Rolled out to all punksterlabs repos on 2026-11-09; complements the weekly full scan
# (~/.claude/hooks/trufflehog_scan.py) and the local gitleaks pre-commit hook.
# A failure here means a WORKING credential was just pushed: rotate it at the provider.
name: secret-scan
on:
  push:
permissions:
  contents: read
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab # v3.95.3
        with:
          extra_args: --only-verified
